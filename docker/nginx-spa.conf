# Fragmento para sitio estático (Vite build en /usr/share/nginx/html).
# Incluí este archivo desde el server {} principal o usalo como default.conf en la imagen Docker.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Web App Manifest (vite-plugin-pwa lo emite como /manifest.webmanifest en dist/)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Service Worker: nunca cachear en el servidor; si no, el SW no puede actualizarse.
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
        try_files $uri =404;
    }

    # Workbox (generado por vite-plugin-pwa): mismo criterio para detectar nuevas versiones.
    location ~* ^/workbox-[a-zA-Z0-9_-]+\.js$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
