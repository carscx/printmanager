name: Deploy PROD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # El nombre de la imagen DEBE ir en minúsculas
          tags: ghcr.io/${{ github.repository_owner }}/printmanager:latest
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.PROD_SUPABASE_ANON_KEY }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Necesitamos el checkout para pillar el docker-compose.yml del repo

      - name: Copiar docker-compose al VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: carscx-printmanager
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/home/carscx-printmanager/app/"

      - name: SSH Remote Command
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: carscx-printmanager
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /home/carscx-printmanager/app/
            # Sed para asegurar que use la imagen correcta con el owner en minúsculas
            sed -i "s|image:.*|image: ghcr.io/${{ github.repository_owner }}/printmanager:latest|g" docker-compose.yml
            docker compose pull
            docker compose up -d
            docker image prune -f