name: Deploy PROD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push App
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/printmanager:latest
          build-args: |
            VITE_API_URL=/api

      - name: Build and Push API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/printmanager-api:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Total vía SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: carscx-printmanager
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,POSTGRES_PASSWORD,JWT_SECRET
          script: |
            mkdir -p /home/carscx-printmanager/app
            cd /home/carscx-printmanager/app

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cat <<EOF > docker-compose.yml
            services:
              db:
                image: postgres:16-alpine
                container_name: printmanager-db
                restart: always
                environment:
                  POSTGRES_USER: printmanager
                  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                  POSTGRES_DB: printmanager
                volumes:
                  - pgdata:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U printmanager -d printmanager"]
                  interval: 5s
                  timeout: 5s
                  retries: 20

              api:
                image: ghcr.io/${{ github.repository_owner }}/printmanager-api:latest
                container_name: printmanager-api
                restart: always
                depends_on:
                  db:
                    condition: service_healthy
                environment:
                  DATABASE_URL: postgres://printmanager:${{ secrets.POSTGRES_PASSWORD }}@db:5432/printmanager
                  JWT_SECRET: ${{ secrets.JWT_SECRET }}
                  JWT_EXPIRES_IN: 7d
                  PORT: 3001
                  CORS_ORIGIN: "*"
                expose:
                  - "3001"

              printmanager:
                image: ghcr.io/${{ github.repository_owner }}/printmanager:latest
                container_name: printmanager-app
                restart: always
                depends_on:
                  - api
                ports:
                  - "3010:80"

            volumes:
              pgdata:
            EOF

            docker compose pull
            docker compose up -d
            docker image prune -f
