name: Deploy to CloudPanel (FTP)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 📂 Sync files via SFTP (SSH Key)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "./index.html,./js/**,./README.md"
          target: "/home/carscx-printmanager/htdocs/printmanager.carscx.com/"
          rm: false
          strip_components: 0
          overwrite: true
