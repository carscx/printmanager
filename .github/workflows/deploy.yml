name: Deploy to CloudPanel (FTP)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 📂 Sync files via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: "."
          target: "/home/carscx-printmanager/htdocs/printmanager.carscx.com/"
          rm: false
          strip_components: 0
          exclude: |
            .git
            .github
            node_modules
            update_schema.sql
            README.md
