name: Deploy PROD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/printmanager:latest
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.PROD_SUPABASE_ANON_KEY }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Total vía SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: carscx-printmanager
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Preparar la carpeta
            mkdir -p /home/carscx-printmanager/app
            cd /home/carscx-printmanager/app

            # 2. Login en el registro de GitHub
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 3. Escribir el docker-compose.yml (Bypass SCP)
            # Esto pisa el archivo viejo con la configuración fresca del repo
            cat <<EOF > docker-compose.yml
            services:
              printmanager:
                image: ghcr.io/${{ github.repository_owner }}/printmanager:latest
                container_name: printmanager-app
                ports:
                  - "3010:80"
                restart: always
            EOF

            # 4. Pull de la imagen nueva y levantada del servicio
            docker compose pull
            docker compose up -d
            docker image prune -f